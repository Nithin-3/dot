# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor= ,preferred,auto,1
# monitor= HDMI-A-2,preferred,auto,1,
# monitor=eDP-1,1920x1080@60,0x0,1
# monitor=HDMI-A-1,1920x1080@60,1920x0,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = nemo
$menu = qs -c lancher
$browser = firefox


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = hyprpaper & swaync & hypridle $ ~/.batt.sh
exec-once = swaync & hypridle & ozhium-ollium & awww-daemon &
exec-once = hyprscratch init clean spotless & eww daemon 
exec-once = eww open clock & ~/startup
# Set environment variables
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/keybinds.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum
#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(019606ff) # 1 150 6 1 #019606ff
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 0.95
    inactive_opacity = 0.75

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 10
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    bezier = fast, 0.2, 0.9, 0.2, 1

    animation = windows, 1, 3, fast, slide
    animation = windowsIn, 1, 3, fast, popin 95%
    animation = windowsOut, 1, 2, fast, popin 95%
    animation = windowsMove, 1, 2, fast

    animation = fade, 1, 2, fast

    animation = layers, 1, 3, fast, fade

    animation = workspaces, 1, 3, fast, slidefade

    animation = border, 1, 4, fast
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = 0 # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# windowrulev2 = suppressevent maximize, class:.*

# windowrulev2 = move center,initialClass:^(foot-dropterm)$

# windowrulev2 = size 600 600, class:Godot, title:Create New Node
# windowrulev2 = move 410 125, class:Godot, title:Create New Node
# windowrulev2 = size 600 600, class:Godot, title:Project Settings.*
# windowrulev2 = move 410 125, class:Godot, title:Project Settings.*
# windowrulev2 = size 600 600, class:Godot, title:Instantiate Child Scene
# windowrulev2 = move 410 125, class:Godot, title:Instantiate Child Scene
#
# windowrulev2 = size 600 600, class:Godot, title:Configure Asset Before Installing
# windowrulev2 = move 410 125, class:Godot, title:Configure Asset Before Installing
#
# windowrulev2 = fullscreenstate 2 0, class:Godot,title: .*Godot Engine



# Scratchpad terminals
windowrule {
    name   = foot-dropterm
    match:class = foot-dropterm
    float  = yes
    move = monitor_w*0.5-30 30
    size = monitor_w*0.5 monitor_h*0.6
}

windowrule {
    name   = foot-btop
    match:class = foot-btop
    float  = yes
    center = yes
    size = monitor_w*0.5 monitor_h*0.7
}

windowrule {
    name   = foot-nvtop
    match:class = foot-nvtop
    float  = yes
    center = yes
    size = monitor_w*0.5 monitor_h*0.7
}

windowrule {
    name = protonvpn-app
    match:class = proton.vpn.app.gtk
    float = yes
    center = yes
}
