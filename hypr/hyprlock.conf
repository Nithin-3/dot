background {
    monitor =
    path = ~/.config/hypr/red.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}
label {
    monitor =
    text =  cmd[update:1000] date +'%H󰇘%M󰇘%S'
    color = rgba(150,5,2,1)
    font_size = 60
    font_family = Noto Sans
    rotate=5
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text =  cmd[] date +'%a'
    color = rgba(150,5,2,1)
    font_size = 25
    font_family = Noto Sans
    rotate=5
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text =  cmd[update:1000] date +'%D'
    color = rgba(150,5,2,1)
    font_size = 25
    font_family = Noto Sans
    rotate=5
    position = 0, 80
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    placeholder_text = sudo $USER
    outer_color = rgba(100,50,20,0.6) rgba(150,5,2,1) 30deg
    check_color=rgba(150,5,2,1)
    fail_color=rgba(ff6633ee) rgba(150,5,2,1) 40deg

    font_color = rgb(150,5,2,1)
    fade_on_empty = false
    rounding = 15
    font_color=rgba(150,5,2,1)
    fail_timeout=300
    dots_text_format=󰵉.
    position = 0, -20
    halign = center
    valign = center
}
